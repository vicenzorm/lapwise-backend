spring.application.name=lapwise-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lapwise
spring.datasource.username=lapwise
spring.datasource.password=lapwise

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

lapwise.strava.client-id=${STRAVA_CLIENT_ID:}
lapwise.strava.client-secret=${STRAVA_CLIENT_SECRET:}
lapwise.strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:8080/auth/strava/callback}
lapwise.session.secret=${SESSION_SECRET}

lapwise.openrouter.api-key=${OPENROUTER_API_KEY:}
lapwise.openrouter.model=${OPENROUTER_MODEL:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.writer-with-order-by-keys=true
